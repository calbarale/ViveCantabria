<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViveCantabria</title>
<meta name="description" content="Restaurantes, miradores, rutas, pueblos y playas de Cantabria. Busca dónde estás y ordena los sitios por cercanía.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#12302d">

<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://tile.openstreetmap.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

<style>
  :root {
    --ink: #12302d;
    --ink-suave: #3d5a56;
    --papel: #f2f6f4;
    --tarjeta: #ffffff;
    --linea: #d3dfda;
    --yema: #f4b32a;
    --azul: #0b6bcb;
    --fuente-titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --fuente-texto: "Figtree", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: 12px; -webkit-tap-highlight-color: rgba(18, 48, 45, 0.12); }

  body {
    margin: 0;
    background: var(--papel);
    color: var(--ink);
    font-family: var(--fuente-texto);
    font-size: 1rem;
    line-height: 1.5;
  }

  :focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
  .cabecera :focus-visible { outline-color: #fff; }

  .saltar {
    position: absolute;
    left: 12px;
    top: -64px;
    z-index: 2000;
    padding: 10px 14px;
    background: var(--yema);
    color: var(--ink);
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none;
  }
  .saltar:focus { top: 12px; }

  .sr {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- Cabecera ---------- */
  .cabecera { position: relative; z-index: 30; background: var(--ink); color: #fff; padding: 28px 20px 22px; }
  .cabecera-in { max-width: 1240px; margin: 0 auto; }

  .cabecera h1 {
    margin: 0 0 6px;
    font-family: var(--fuente-titulo);
    font-weight: 800;
    font-size: clamp(2rem, 5.5vw, 3.4rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  .cabecera p.intro { margin: 0 0 18px; max-width: 52ch; color: #cfe0db; }

  .buscador { display: flex; flex-wrap: wrap; gap: 10px; }

  .campo-busqueda { position: relative; flex: 1 1 260px; min-width: 0; }

  .campo-busqueda input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 0;
    border-radius: 10px;
    font: inherit;
    color: var(--ink);
    background: #fff;
  }

  .btn {
    height: 48px;
    padding: 0 18px;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .btn-primario { background: var(--yema); color: var(--ink); }
  .btn-primario:hover { background: #ffc54d; }
  .btn-secundario { background: transparent; color: #fff; border-color: #6f8d88; }
  .btn-secundario:hover { border-color: #fff; }

  .estado { min-height: 1.5em; margin: 12px 0 0; font-size: 0.95rem; color: #cfe0db; }
  .estado.error { color: #ffd7a8; }

  /* ---------- Sugerencias del buscador ---------- */
  .sugerencias {
    position: absolute;
    z-index: 50;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: #fff;
    color: var(--ink);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    max-height: min(60vh, 360px);
    overflow: auto;
  }

  .sug-grupo {
    padding: 8px 10px 4px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-suave);
  }

  .sug {
    display: grid;
    gap: 1px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .sug:hover { background: #eef4f2; }
  .sug[aria-selected="true"] { background: #e3eeea; box-shadow: inset 3px 0 0 var(--ink); }
  .sug b { font-weight: 600; overflow-wrap: anywhere; }
  .sug span { font-size: 0.88rem; color: var(--ink-suave); overflow-wrap: anywhere; }

  /* ---------- Contenido ---------- */
  .contenido {
    max-width: 1240px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(320px, 430px) 1fr;
    align-items: start;
  }

  .panel { padding: 20px; }

  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--linea);
    background: var(--tarjeta);
    color: var(--ink);
    font: inherit;
    font-size: 0.92rem;
    font-weight: 500;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--ink); }

  .btn, .chip, .tarjeta-cuerpo { touch-action: manipulation; }

  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .filtros-tipo .chip { padding: 3px 12px; font-size: 0.86rem; background: transparent; }
  .filtros-tipo .chip[aria-pressed="true"] { background: var(--yema); border-color: var(--ink); color: var(--ink); }

  .punto {
    display: inline-block;
    width: 10px; height: 10px;
    margin-right: 7px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    vertical-align: baseline;
  }
  .chip[aria-pressed="true"] .punto { border-color: #fff; }

  .resumen { margin: 0 0 12px; color: var(--ink-suave); font-size: 0.95rem; }

  .lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }

  .tarjeta { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px; overflow: hidden; }
  .tarjeta.activa { border-color: var(--ink); box-shadow: 0 0 0 2px var(--yema); }

  .tarjeta-cuerpo {
    display: grid;
    gap: 2px;
    width: 100%;
    padding: 14px 16px 12px;
    text-align: left;
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
  }
  .tarjeta-cuerpo:hover { background: #f1f7f5; }
  .tarjeta-cuerpo > * { min-width: 0; }

  .tarjeta-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .nombre { min-width: 0; overflow-wrap: anywhere; font-weight: 600; font-size: 1.08rem; }
  .dist { font-weight: 600; color: var(--azul); white-space: nowrap; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  .tipo, .dir { color: var(--ink-suave); font-size: 0.92rem; overflow-wrap: anywhere; }
  .nota { margin-top: 4px; font-size: 0.92rem; overflow-wrap: anywhere; }

  .detalles { display: flex; flex-wrap: wrap; gap: 2px 16px; margin-top: 4px; font-size: 0.9rem; overflow-wrap: anywhere; }
  .detalles b { font-weight: 600; }

  .acciones {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    padding: 10px 16px;
    border-top: 1px solid var(--linea);
    background: #f8fbfa;
  }

  .acciones a, .pop a {
    color: var(--ink);
    font-weight: 600;
    font-size: 0.92rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--yema);
    text-decoration-thickness: 2px;
  }
  .acciones a:hover, .pop a:hover { text-decoration-color: var(--ink); }

  .vacio { padding: 18px; border: 1.5px dashed var(--linea); border-radius: 12px; color: var(--ink-suave); }

  /* ---------- Mapa ---------- */
  .mapa-wrap { position: sticky; top: 0; height: 100vh; height: 100dvh; }
  #mapa { height: 100%; width: 100%; background: #dfe8e4; }

  .pin-wrap { width: 28px; height: 34px; cursor: pointer; background: none; border: 0; }
  .pin {
    --c: var(--yema);
    display: block;
    width: 26px; height: 26px;
    margin: 2px;
    background: var(--c);
    border: 3px solid var(--ink);
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    position: relative;
  }
  .pin::after { content: ""; position: absolute; inset: 5px; background: var(--ink); border-radius: 50%; }
  .pin-wrap.activo .pin { background: var(--ink); }
  .pin-wrap.activo .pin::after { background: var(--c); }

  .yo {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--azul);
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3);
  }

  /* Controles del mapa: brújula, zoom y mi ubicación */
  .maplibregl-ctrl-group button { width: 40px; height: 40px; }
  .ctrl-ubicacion .maplibregl-ctrl-icon {
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29' fill='none' stroke='%23333' stroke-width='2'%3E%3Ccircle cx='14.5' cy='14.5' r='6'/%3E%3Ccircle cx='14.5' cy='14.5' r='2' fill='%23333'/%3E%3Cpath d='M14.5 3v5M14.5 21v5M3 14.5h5M21 14.5h5'/%3E%3C/svg%3E");
  }
  .ctrl-ubicacion[aria-busy="true"] { opacity: 0.45; }

  .maplibregl-popup-content { font-family: var(--fuente-texto); padding: 12px 36px 12px 14px; border-radius: 10px; }
  .maplibregl-popup-close-button { width: 34px; height: 34px; font-size: 22px; color: var(--ink); }
  .pop { display: grid; gap: 3px; }
  .pop strong { font-size: 1.02rem; }
  .pop span { color: var(--ink-suave); font-size: 0.92rem; }
  .pop a { margin-top: 6px; }

  /* ---------- Móvil ---------- */
  @media (max-width: 820px) {
    .contenido { grid-template-columns: 1fr; }
    .mapa-wrap { position: static; height: 52vh; height: 52dvh; order: -1; }
    .panel { padding: 16px; }
    .cabecera { padding: 22px 16px 18px; }
    .buscador .btn { flex: 1 1 auto; }
  }

  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>

<body>
  <a class="saltar" href="#principal">Saltar al contenido</a>

  <header class="cabecera">
    <div class="cabecera-in">
      <h1 translate="no">ViveCantabria</h1>
      <p class="intro">Restaurantes, miradores, rutas, pueblos y playas. Escribe dónde estás o usa tu ubicación y verás lo que tienes más cerca.</p>

      <form id="form-busqueda" class="buscador" role="search">
        <div class="campo-busqueda">
          <label class="sr" for="direccion">Pueblo, calle o alojamiento</label>
          <input id="direccion" type="search" name="lugar" placeholder="Ej. Santillana del Mar…" autocomplete="off"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugerencias" aria-haspopup="listbox">
          <ul id="sugerencias" class="sugerencias" role="listbox" aria-label="Sugerencias" hidden></ul>
          <p id="sug-estado" class="sr" role="status" aria-live="polite"></p>
        </div>
        <button type="submit" id="btn-buscar" class="btn btn-primario">Buscar</button>
        <button type="button" id="btn-ubicacion" class="btn btn-secundario">Usar mi ubicación</button>
      </form>

      <p id="estado" class="estado" role="status" aria-live="polite"></p>
    </div>
  </header>

  <main id="principal" class="contenido">
    <section class="panel" aria-labelledby="h-sitios">
      <h2 id="h-sitios" class="sr">Sitios</h2>
      <div id="filtros" class="filtros" role="group" aria-label="Filtrar por categoría"></div>
      <div id="filtros-tipo" class="filtros filtros-tipo" role="group" aria-label="Filtrar por tipo" hidden></div>
      <p id="resumen" class="resumen" aria-live="polite"></p>
      <ol id="lista" class="lista"></ol>
    </section>

    <div class="mapa-wrap">
      <div id="mapa" role="region" aria-label="Mapa de sitios"></div>
    </div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    // =====================================================
    //  CATEGORÍAS: un archivo JSON por categoría.
    //  Para añadir una nueva: crea el archivo en datos/ y añádela aquí.
    // =====================================================
    const CATEGORIAS = [
      { nombre: 'Comer',     archivo: 'datos/comer.json',     color: '#f4b32a' },
      { nombre: 'Miradores', archivo: 'datos/miradores.json', color: '#e8684a' },
      { nombre: 'Rutas',     archivo: 'datos/rutas.json',     color: '#3f9b5a' },
      { nombre: 'Pueblos',   archivo: 'datos/pueblos.json',   color: '#8a63c9' },
      { nombre: 'Playas',    archivo: 'datos/playas.json',    color: '#2fb3c4' }
    ];
    const REGION = 'Cantabria';
    const BBOX_REGION = '-4.9,42.7,-3.1,43.6';   // oeste, sur, este, norte (para predicción y búsqueda)
    const colorDe = (cat) => (CATEGORIAS.find((c) => c.nombre === cat) || {}).color || '#8fa3a0';

    // ---------- Utilidades ----------
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    const normalizar = (t) => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const esMovil = () => matchMedia('(max-width: 820px)').matches;
    const dur = (ms) => (reduceMotion ? 0 : ms);

    function estado(texto, esError = false) {
      const el = $('#estado');
      el.textContent = texto;
      el.classList.toggle('error', esError);
    }

    function formatoDistancia(m) {
      if (m < 1000) return Math.round(m / 10) * 10 + '\u00A0m';
      return (m / 1000).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + '\u00A0km';
    }

    // Distancia en línea recta entre dos puntos {lat, lng}
    function metros(a, b) {
      const R = 6371000, rad = (x) => (x * Math.PI) / 180;
      const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    // Google Maps se abre buscando el sitio por nombre + dirección (no por coordenadas).
    // Si un sitio no sale bien, añade en su JSON:  "maps": "texto exacto a buscar"
    function textoMaps(r) {
      if (r.maps) return r.maps;
      const partes = [r.nombre, r.direccion].filter(Boolean);
      if (!partes.join(' ').toLowerCase().includes(REGION.toLowerCase())) partes.push(REGION);
      return partes.join(', ');
    }
    const urlVer = (r) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(textoMaps(r));
    const urlRuta = (r) => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(textoMaps(r));

    // ---------- Mapa (MapLibre: permite girar el mapa y orientarlo al norte) ----------
    const mapa = new maplibregl.Map({
      container: 'mapa',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            maxzoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
          }
        },
        layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
      },
      center: [-4.0, 43.2],
      zoom: 8,
      minZoom: 5,
      maxZoom: 18,
      maxPitch: 0,             // sin inclinación: solo giro
      pitchWithRotate: false,
      touchPitch: false,
      attributionControl: { compact: true },
      locale: {
        'NavigationControl.ResetBearing': 'Orientar al norte',
        'NavigationControl.ZoomIn': 'Acercar',
        'NavigationControl.ZoomOut': 'Alejar',
        'AttributionControl.ToggleAttribution': 'Mostrar atribución',
        'AttributionControl.MapFeedback': 'Comentarios sobre el mapa',
        'Popup.Close': 'Cerrar',
        'Marker.Title': 'Marcador',
        'Map.Title': 'Mapa',
        'LogoControl.Title': 'Logotipo de MapLibre'
      }
    });

    // Brújula (gira con el mapa; al pulsarla se orienta al norte) y zoom
    mapa.addControl(new maplibregl.NavigationControl({ showCompass: true, showZoom: true, visualizePitch: false }), 'top-right');

    // Botón "Ir a mi ubicación"
    class ControlUbicacion {
      onAdd() {
        this.contenedor = document.createElement('div');
        this.contenedor.className = 'maplibregl-ctrl maplibregl-ctrl-group';
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ctrl-ubicacion';
        b.title = 'Ir a mi ubicación';
        b.setAttribute('aria-label', 'Ir a mi ubicación');
        b.innerHTML = '<span class="maplibregl-ctrl-icon" aria-hidden="true"></span>';
        b.addEventListener('click', () => ubicar('centrar'));
        this.contenedor.appendChild(b);
        return this.contenedor;
      }
      onRemove() { this.contenedor.remove(); }
    }
    mapa.addControl(new ControlUbicacion(), 'top-right');

    // Círculo de precisión de la ubicación
    let precisionActual = null;
    function dibujarPrecision() {
      const src = mapa.getSource('precision');
      if (!src) return;
      if (!precisionActual) { src.setData({ type: 'FeatureCollection', features: [] }); return; }
      const { lng, lat, r } = precisionActual;
      const pts = [];
      for (let i = 0; i <= 64; i++) {
        const a = (i / 64) * 2 * Math.PI;
        pts.push([lng + (r * Math.cos(a)) / (111320 * Math.cos((lat * Math.PI) / 180)), lat + (r * Math.sin(a)) / 110574]);
      }
      src.setData({ type: 'Feature', geometry: { type: 'Polygon', coordinates: [pts] } });
    }
    mapa.on('load', () => {
      mapa.addSource('precision', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      mapa.addLayer({ id: 'precision-relleno', type: 'fill', source: 'precision', paint: { 'fill-color': '#0b6bcb', 'fill-opacity': 0.1 } });
      mapa.addLayer({ id: 'precision-linea', type: 'line', source: 'precision', paint: { 'line-color': '#0b6bcb', 'line-width': 1 } });
      dibujarPrecision();
    });

    function limites(puntos) {                 // puntos: [lng, lat]
      const b = new maplibregl.LngLatBounds();
      puntos.forEach((p) => b.extend(p));
      return b;
    }

    // ---------- Estado ----------
    let sitios = [];            // { i, r, pos, marcador, visible, dist }
    let filtroCat = 'Todos';
    let filtroTipo = 'Todos';
    let origen = null;          // { lat, lng }
    let activo = null;
    let marcadorOrigen = null;
    let lugarBuscado = null;
    let buscando = false;

    // El estado (filtros y lugar buscado) vive en la URL para poder compartirla:  ?cat=Rutas&tipo=Costera&q=Santillana
    function escribirUrl() {
      const p = new URLSearchParams();
      if (filtroCat !== 'Todos') p.set('cat', filtroCat);
      if (filtroTipo !== 'Todos') p.set('tipo', filtroTipo);
      if (lugarBuscado) p.set('q', lugarBuscado);
      const s = p.toString();
      try { history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + location.hash); } catch (e) {}
    }

    const visibles = () => sitios.filter((s) =>
      (filtroCat === 'Todos' || s.r.categoria === filtroCat) &&
      (filtroTipo === 'Todos' || s.r.tipo === filtroTipo)
    );

    // ---------- Pintar ----------
    function lineaCategoria(r) {
      return `<span class="punto" aria-hidden="true" style="background:${colorDe(r.categoria)}"></span>${esc(r.categoria)}${r.tipo ? ': ' + esc(r.tipo) : ''}`;
    }

    function popupHtml(r) {
      return `<div class="pop">
        <strong translate="no">${esc(r.nombre)}</strong>
        <span>${lineaCategoria(r)}</span>
        ${r.direccion ? `<span>${esc(r.direccion)}</span>` : ''}
        <a href="${urlVer(r)}" target="_blank" rel="noopener">Ver en Google Maps</a>
      </div>`;
    }

    // "detalles" es un objeto libre por sitio, p. ej. {"Distancia": "8 km", "Desnivel": "350 m"}
    function detallesHtml(r) {
      if (!r.detalles || typeof r.detalles !== 'object') return '';
      const items = Object.entries(r.detalles)
        .map(([k, v]) => `<span><b>${esc(k)}:</b> ${esc(v)}</span>`).join('');
      return items ? `<span class="detalles">${items}</span>` : '';
    }

    function tarjetaHtml(s) {
      const r = s.r;
      const esRuta = r.categoria === 'Rutas';
      return `<li class="tarjeta" id="t-${s.i}">
        <button type="button" class="tarjeta-cuerpo" data-i="${s.i}">
          <span class="tarjeta-top">
            <span class="nombre" translate="no">${esc(r.nombre)}</span>
            ${s.dist != null ? `<span class="dist">${formatoDistancia(s.dist)}</span>` : ''}
          </span>
          <span class="tipo">${lineaCategoria(r)}</span>
          ${r.direccion ? `<span class="dir">${esc(r.direccion)}</span>` : ''}
          ${detallesHtml(r)}
          ${r.nota ? `<span class="nota">${esc(r.nota)}</span>` : ''}
        </button>
        <div class="acciones">
          <a href="${urlVer(r)}" target="_blank" rel="noopener">Ver en Google Maps</a>
          <a href="${urlRuta(r)}" target="_blank" rel="noopener">${esRuta ? 'Cómo llegar al inicio' : 'Cómo llegar'}</a>
          ${r.web ? `<a href="${esc(r.web)}" target="_blank" rel="noopener">${esRuta ? 'Ver ruta' : 'Más información'}</a>` : ''}
        </div>
      </li>`;
    }

    function pintar() {
      const vis = visibles();
      if (origen) vis.sort((a, b) => a.dist - b.dist);

      sitios.forEach((s) => {
        const v = vis.includes(s);
        if (v && !s.visible) { s.marcador.addTo(mapa); s.visible = true; }
        else if (!v && s.visible) { s.marcador.remove(); s.visible = false; }
      });

      $('#lista').innerHTML = vis.length
        ? vis.map(tarjetaHtml).join('')
        : '<li class="vacio">No hay sitios con este filtro. Prueba con otro.</li>';

      const n = `${vis.length} ${vis.length === 1 ? 'sitio' : 'sitios'}`;
      $('#resumen').textContent = origen
        ? `${n}, del más cercano al más lejano (distancia en línea recta)`
        : `${n}. Busca dónde estás para ordenarlos por cercanía.`;

      if (activo && vis.includes(activo)) marcarActivo(activo, true);
    }

    function marcarActivo(s, si) {
      s.marcador.getElement().classList.toggle('activo', si);
      document.getElementById('t-' + s.i)?.classList.toggle('activa', si);
    }

    function abrirPopup(s) {
      if (!s.marcador.getPopup().isOpen()) s.marcador.togglePopup();
    }

    function destacar(s, volar) {
      if (activo) marcarActivo(activo, false);
      activo = s;
      marcarActivo(s, true);

      if (volar) {
        mapa.easeTo({ center: [s.r.lng, s.r.lat], zoom: Math.max(mapa.getZoom(), 14), duration: dur(600) });
        abrirPopup(s);
        if (esMovil()) {
          $('.mapa-wrap').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
        }
      } else {
        document.getElementById('t-' + s.i)?.scrollIntoView({
          block: 'nearest',
          behavior: reduceMotion ? 'auto' : 'smooth'
        });
      }
    }

    function crearMarcador(s) {
      const r = s.r;
      const el = document.createElement('div');
      el.className = 'pin-wrap';
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `${r.nombre}, ${r.categoria}`);
      el.innerHTML = `<span class="pin" style="--c:${colorDe(r.categoria)}"></span>`;

      const popup = new maplibregl.Popup({ offset: [0, -32], maxWidth: '280px' }).setHTML(popupHtml(r));
      const m = new maplibregl.Marker({ element: el, anchor: 'bottom' })
        .setLngLat([r.lng, r.lat])
        .setPopup(popup);

      el.addEventListener('click', () => destacar(s, false));   // el popup lo abre MapLibre al hacer clic
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          destacar(s, false);
          m.togglePopup();
        }
      });
      return m;
    }

    // ---------- Filtros (categoría y, dentro de ella, tipo) ----------
    function chipHtml(valor, pulsado, color) {
      return `<button type="button" class="chip" aria-pressed="${pulsado}" data-valor="${esc(valor)}">${
        color ? `<span class="punto" aria-hidden="true" style="background:${color}"></span>` : ''
      }${esc(valor)}</button>`;
    }

    function construirFiltros() {
      const presentes = CATEGORIAS.filter((c) => sitios.some((s) => s.r.categoria === c.nombre));
      const cont = $('#filtros');
      if (presentes.length < 2) { cont.hidden = true; return; }
      cont.hidden = false;
      cont.innerHTML = chipHtml('Todos', filtroCat === 'Todos') +
        presentes.map((c) => chipHtml(c.nombre, filtroCat === c.nombre, c.color)).join('');
    }

    function construirFiltrosTipo() {
      const cont = $('#filtros-tipo');
      const tipos = filtroCat === 'Todos' ? [] : [...new Set(
        sitios.filter((s) => s.r.categoria === filtroCat).map((s) => s.r.tipo).filter(Boolean)
      )];
      if (tipos.length < 2) { cont.hidden = true; cont.innerHTML = ''; return; }
      cont.hidden = false;
      cont.innerHTML = chipHtml('Todos', filtroTipo === 'Todos') +
        tipos.map((t) => chipHtml(t, filtroTipo === t)).join('');
    }

    function ajustarVista() {
      if (origen) return;
      const pts = visibles().map((s) => [s.r.lng, s.r.lat]);
      if (pts.length) mapa.fitBounds(limites(pts), { padding: 50, maxZoom: 12, duration: dur(500) });
    }

    $('#filtros').addEventListener('click', (e) => {
      const b = e.target.closest('.chip');
      if (!b) return;
      filtroCat = b.dataset.valor;
      filtroTipo = 'Todos';
      construirFiltros();
      construirFiltrosTipo();
      pintar();
      ajustarVista();
      escribirUrl();
    });

    $('#filtros-tipo').addEventListener('click', (e) => {
      const b = e.target.closest('.chip');
      if (!b) return;
      filtroTipo = b.dataset.valor;
      construirFiltrosTipo();
      pintar();
      ajustarVista();
      escribirUrl();
    });

    $('#lista').addEventListener('click', (e) => {
      const b = e.target.closest('.tarjeta-cuerpo');
      if (!b) return;
      destacar(sitios[Number(b.dataset.i)], true);
    });

    // ---------- Punto de referencia (tu ubicación o un lugar buscado) ----------
    function fijarOrigen(latlng, etiqueta, precision, ajustar = true) {
      origen = { lat: latlng[0], lng: latlng[1] };

      marcadorOrigen?.remove();
      const el = document.createElement('div');
      el.className = 'yo';
      el.title = etiqueta;
      el.setAttribute('role', 'img');
      el.setAttribute('aria-label', etiqueta);
      marcadorOrigen = new maplibregl.Marker({ element: el })
        .setLngLat([origen.lng, origen.lat])
        .addTo(mapa);

      precisionActual = precision && precision < 2000 ? { lng: origen.lng, lat: origen.lat, r: precision } : null;
      dibujarPrecision();

      sitios.forEach((s) => { s.dist = metros(origen, s.pos); });
      pintar();

      if (ajustar) {
        const cercanos = visibles()
          .sort((a, b) => a.dist - b.dist)
          .slice(0, 3)
          .map((s) => [s.r.lng, s.r.lat]);
        mapa.fitBounds(limites([[origen.lng, origen.lat], ...cercanos]), {
          padding: esMovil() ? 40 : 70,
          maxZoom: 15,
          duration: dur(700)
        });
      }
    }

    // ---------- Buscar un lugar (Nominatim / OpenStreetMap), con preferencia por Cantabria ----------
    async function buscarLugar(q) {
      if (buscando) return;
      if (!q) { estado('Escribe un pueblo, una calle o el nombre de tu alojamiento.', true); return; }

      buscando = true;
      const btn = $('#btn-buscar');
      btn.disabled = true;
      btn.textContent = 'Buscando…';
      estado('Buscando…');
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=es&countrycodes=es&viewbox=' + BBOX_REGION + '&q='
          + encodeURIComponent(q);
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const datos = await res.json();

        if (!datos.length) {
          estado('No encuentro ese sitio. Prueba con el pueblo o con la calle y el pueblo.', true);
          return;
        }
        const d = datos[0];
        fijarOrigen([parseFloat(d.lat), parseFloat(d.lon)], d.display_name);
        lugarBuscado = q;
        escribirUrl();
        estado('Sitios cerca de: ' + d.display_name.split(',').slice(0, 3).join(','));
      } catch (err) {
        estado('No se pudo buscar ahora. Inténtalo de nuevo en un momento.', true);
      } finally {
        buscando = false;
        btn.disabled = false;
        btn.textContent = 'Buscar';
      }
    }

    // ---------- Predicción mientras escribes (tus sitios + lugares de Photon / OpenStreetMap) ----------
    const campo = $('#direccion');
    const listaSug = $('#sugerencias');
    let sugerencias = [];
    let indiceSug = -1;
    let tokenSug = 0;
    let temporizadorSug = null;
    let abortoSug = null;
    const cachePhoton = new Map();

    function sitiosCoincidentes(q) {
      const n = normalizar(q);
      return sitios
        .filter((s) => normalizar(s.r.nombre).includes(n) || normalizar(s.r.direccion).includes(n))
        .sort((a, b) => Number(normalizar(b.r.nombre).startsWith(n)) - Number(normalizar(a.r.nombre).startsWith(n)))
        .slice(0, 4)
        .map((s) => ({ tipo: 'sitio', s, titulo: s.r.nombre, sub: lineaCategoria(s.r), subHtml: true }));
    }

    async function pedirPhoton(q, signal) {
      const clave = normalizar(q);
      if (cachePhoton.has(clave)) return cachePhoton.get(clave);
      const url = 'https://photon.komoot.io/api/?limit=6&bbox=' + BBOX_REGION + '&lat=43.2&lon=-4.0&q=' + encodeURIComponent(q);
      const res = await fetch(url, { signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const datos = await res.json();

      const vistos = new Set();
      const items = [];
      (datos.features || []).forEach((f) => {
        const p = f.properties || {};
        const titulo = p.name || [p.street, p.housenumber].filter(Boolean).join(' ');
        if (!titulo || !f.geometry) return;
        const sub = [...new Set([p.district, p.city, p.county])].filter((x) => x && x !== titulo).slice(0, 2).join(', ');
        const etiqueta = [titulo, sub].filter(Boolean).join(', ');
        if (vistos.has(etiqueta)) return;
        vistos.add(etiqueta);
        const [lng, lat] = f.geometry.coordinates;
        items.push({ tipo: 'lugar', titulo, sub, subHtml: false, etiqueta, lat, lng });
      });
      cachePhoton.set(clave, items);
      return items;
    }

    function cerrarSug() {
      listaSug.hidden = true;
      listaSug.innerHTML = '';
      campo.setAttribute('aria-expanded', 'false');
      campo.removeAttribute('aria-activedescendant');
      indiceSug = -1;
    }

    function pintarSug() {
      if (!sugerencias.length) { cerrarSug(); return; }
      let html = '';
      let ultimo = null;
      sugerencias.forEach((it, i) => {
        if (it.tipo !== ultimo) {
          html += `<li role="presentation" class="sug-grupo">${it.tipo === 'sitio' ? 'En la guía' : 'Lugares'}</li>`;
          ultimo = it.tipo;
        }
        html += `<li id="sug-${i}" role="option" class="sug" aria-selected="${i === indiceSug}" data-i="${i}">
          <b>${esc(it.titulo)}</b>${it.sub ? `<span>${it.subHtml ? it.sub : esc(it.sub)}</span>` : ''}
        </li>`;
      });
      listaSug.innerHTML = html;
      listaSug.hidden = false;
      campo.setAttribute('aria-expanded', 'true');
      if (indiceSug >= 0) campo.setAttribute('aria-activedescendant', 'sug-' + indiceSug);
      else campo.removeAttribute('aria-activedescendant');
      $('#sug-estado').textContent = `${sugerencias.length} ${sugerencias.length === 1 ? 'sugerencia' : 'sugerencias'}`;
    }

    function moverSug(delta) {
      if (!sugerencias.length) return;
      indiceSug = (indiceSug + delta + sugerencias.length) % sugerencias.length;
      listaSug.querySelectorAll('.sug').forEach((li) => li.setAttribute('aria-selected', String(Number(li.dataset.i) === indiceSug)));
      campo.setAttribute('aria-activedescendant', 'sug-' + indiceSug);
      document.getElementById('sug-' + indiceSug)?.scrollIntoView({ block: 'nearest' });
    }

    function elegirSug(i) {
      const it = sugerencias[i];
      if (!it) return;
      clearTimeout(temporizadorSug);
      abortoSug?.abort();
      tokenSug++;
      campo.value = it.titulo;
      cerrarSug();

      if (it.tipo === 'sitio') {
        // Si el filtro actual lo oculta, se quitan los filtros para poder verlo
        if (!visibles().includes(it.s)) {
          filtroCat = 'Todos';
          filtroTipo = 'Todos';
          construirFiltros();
          construirFiltrosTipo();
          pintar();
          escribirUrl();
        }
        destacar(it.s, true);
        estado('Mostrando: ' + it.s.r.nombre);
      } else {
        campo.value = it.etiqueta;
        fijarOrigen([it.lat, it.lng], it.etiqueta);
        lugarBuscado = it.etiqueta;
        escribirUrl();
        estado('Sitios cerca de: ' + it.etiqueta);
      }
    }

    campo.addEventListener('input', () => {
      const q = campo.value.trim();
      clearTimeout(temporizadorSug);
      abortoSug?.abort();
      tokenSug++;
      const mio = tokenSug;
      indiceSug = -1;

      if (q.length < 2) { sugerencias = []; cerrarSug(); return; }

      const locales = sitiosCoincidentes(q);
      sugerencias = locales;
      pintarSug();
      if (q.length < 3) return;

      temporizadorSug = setTimeout(async () => {
        abortoSug = new AbortController();
        try {
          const lugares = await pedirPhoton(q, abortoSug.signal);
          if (mio !== tokenSug) return;
          sugerencias = [...locales, ...lugares.slice(0, 5)];
          indiceSug = -1;
          pintarSug();
          if (!sugerencias.length) $('#sug-estado').textContent = 'Sin sugerencias';
        } catch (e) { /* sin predicción de lugares: se queda lo local; Buscar sigue funcionando */ }
      }, 300);
    });

    campo.addEventListener('keydown', (e) => {
      const abierta = !listaSug.hidden;
      if (e.key === 'ArrowDown') { if (abierta) { e.preventDefault(); moverSug(1); } }
      else if (e.key === 'ArrowUp') { if (abierta) { e.preventDefault(); moverSug(-1); } }
      else if (e.key === 'Enter') { if (abierta && indiceSug >= 0) { e.preventDefault(); elegirSug(indiceSug); } }
      else if (e.key === 'Escape') { if (abierta) { e.preventDefault(); cerrarSug(); } }
      else if (e.key === 'Tab') { cerrarSug(); }
    });

    campo.addEventListener('blur', () => setTimeout(cerrarSug, 150));
    campo.addEventListener('focus', () => { if (campo.value.trim().length >= 2 && sugerencias.length) pintarSug(); });

    // mousedown no quita el foco del campo; el clic elige la sugerencia
    listaSug.addEventListener('mousedown', (e) => e.preventDefault());
    listaSug.addEventListener('click', (e) => {
      const li = e.target.closest('.sug');
      if (li) elegirSug(Number(li.dataset.i));
    });

    $('#form-busqueda').addEventListener('submit', (e) => {
      e.preventDefault();
      cerrarSug();
      buscarLugar(campo.value.trim());
    });

    // ---------- Ubicación actual ----------
    // modo 'lista': ordena por cercanía y encuadra los más próximos; modo 'centrar': vuela a tu posición
    function ubicar(modo = 'lista') {
      const boton = document.querySelector('.ctrl-ubicacion');
      if (!navigator.geolocation) {
        estado('Tu navegador no permite obtener la ubicación. Escribe un pueblo o una calle.', true);
        return;
      }
      estado('Obteniendo tu ubicación…');
      boton?.setAttribute('aria-busy', 'true');
      navigator.geolocation.getCurrentPosition(
        (p) => {
          boton?.removeAttribute('aria-busy');
          const ll = [p.coords.latitude, p.coords.longitude];
          fijarOrigen(ll, 'Tu ubicación', p.coords.accuracy, modo === 'lista');
          if (modo === 'centrar') {
            mapa.easeTo({ center: [ll[1], ll[0]], zoom: Math.max(mapa.getZoom(), 14), duration: dur(700) });
          }
          lugarBuscado = null;
          escribirUrl();
          estado('Ordenado por cercanía a tu ubicación.');
        },
        (err) => {
          boton?.removeAttribute('aria-busy');
          const mensajes = {
            1: 'Permiso de ubicación denegado. Actívalo en los ajustes del sitio o escribe un pueblo o una calle.',
            2: 'No se pudo determinar tu posición. Escribe un pueblo o una calle.',
            3: 'La ubicación tardó demasiado. Inténtalo de nuevo o escribe un pueblo o una calle.'
          };
          estado(mensajes[err.code] || 'No se pudo obtener tu ubicación.', true);
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
      );
    }
    $('#btn-ubicacion').addEventListener('click', () => ubicar('lista'));

    // ---------- Carga de datos: un archivo por categoría ----------
    async function cargarDatos() {
      const resultados = await Promise.allSettled(
        CATEGORIAS.map((c) => fetch(c.archivo).then((r) => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }))
      );

      const todos = [];
      const fallidas = [];
      const sinCoordenadas = [];

      resultados.forEach((res, k) => {
        const cat = CATEGORIAS[k];
        if (res.status !== 'fulfilled' || !Array.isArray(res.value)) { fallidas.push(cat); return; }
        res.value.forEach((r) => {
          if (!Number.isFinite(r.lat) || !Number.isFinite(r.lng)) { sinCoordenadas.push(r.nombre || '(sin nombre)'); return; }
          todos.push({ ...r, categoria: cat.nombre });   // la categoría la da el archivo
        });
      });
      return { todos, fallidas, sinCoordenadas };
    }

    cargarDatos().then(({ todos, fallidas, sinCoordenadas }) => {
      sitios = todos.map((r, i) => {
        const s = { i, r, pos: { lat: r.lat, lng: r.lng }, visible: false, dist: null };
        s.marcador = crearMarcador(s);
        return s;
      });

      const params = new URLSearchParams(location.search);
      const catUrl = params.get('cat');
      if (catUrl && sitios.some((s) => s.r.categoria === catUrl)) {
        filtroCat = catUrl;
        const tipoUrl = params.get('tipo');
        if (tipoUrl && sitios.some((s) => s.r.categoria === catUrl && s.r.tipo === tipoUrl)) filtroTipo = tipoUrl;
      }

      construirFiltros();
      construirFiltrosTipo();
      pintar();
      ajustarVista();

      if (fallidas.length === CATEGORIAS.length) {
        estado('No se pudieron cargar los datos. Abre la web desde su URL publicada o desde un servidor local, no con doble clic.', true);
        return;
      }
      if (fallidas.length) {
        estado('No se pudo cargar: ' + fallidas.map((c) => c.archivo).join(', ') + '. Comprueba que el archivo existe y que no tiene errores de formato.', true);
      } else if (sinCoordenadas.length) {
        estado('Sitios sin lat/lng válidos (no se muestran): ' + sinCoordenadas.join(', '), true);
      }

      // Si la URL trae un lugar (?q=...), se busca. Si no y ya diste permiso de ubicación antes, se usa solo.
      const qUrl = params.get('q');
      if (qUrl) {
        campo.value = qUrl;
        buscarLugar(qUrl);
      } else if (navigator.permissions) {
        navigator.permissions.query({ name: 'geolocation' })
          .then((p) => { if (p.state === 'granted') ubicar('lista'); })
          .catch(() => {});
      }
    });
  </script>
</body>
